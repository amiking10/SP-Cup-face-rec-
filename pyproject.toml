[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c3-tracker"
version = "0.1.0"
description = "Measurable MediaPipe and DeepSORT multi-face tracking baseline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "setuptools==80.9.0", "numpy==1.26.4",
  "opencv-python==4.11.0.86", "opencv-contrib-python==4.11.0.86",
  "mediapipe==0.10.21",
  "deep-sort-realtime @ https://github.com/levan92/deep_sort_realtime/archive/3341f823ee0ad20aa58c906079a37f3d43b42bbe.zip",
  "torch==2.5.1", "torchvision==0.20.1"
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
benchmark = ["motmetrics==1.4.0", "pandas==2.2.3", "xmltodict==0.14.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
