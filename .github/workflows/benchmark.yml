name: C3 benchmark infrastructure
on:
  push:
  pull_request:
jobs:
  synthetic-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU tracker and benchmark dependencies
        run: |
          python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,benchmark]'
      - name: Run tests without datasets or model downloads
        run: python -m pytest -q tests datasets/tests
      - name: Check dependencies
        run: python -m pip check
