name: FaceRec runtime and research checks
on:
  push:
  pull_request:
jobs:
  runtime-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Export selected runtime files
        run: |
          python tools/export_runtime.py --output-dir build/runtime
          python tools/export_runtime.py --verify build/runtime
      - name: Install only the exported package and its tests
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install './build/runtime[test]'
      - name: Check installed runtime without the research checkout on sys.path
        working-directory: build/runtime
        run: |
          python -I -m c3_tracker --help
          python -I -m pytest -q
          python -m pip check
  synthetic-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU tracker and benchmark dependencies
        run: |
          python -m pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test,benchmark]'
      - name: Run tests without datasets or model downloads
        run: python -m pytest -q tests datasets/tests
      - name: Check dependencies
        run: python -m pip check
